services:
  # Backend FastAPI service
  - type: web
    name: backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: /workspace

  # Frontend React service
  - type: web
    name: frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: backend
          type: web
          property: host

databases:
  - name: student-db
    databaseName: student_performance
    user: student_user
    plan: free
